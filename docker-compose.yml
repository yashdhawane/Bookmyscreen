version: '3.8'

services:
  mongo:
    image: mongo:6
    command: --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  mongo-init:
    image: mongo:6
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./bms-backend
    ports:
      - "9000:9000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://admin:password123@mongo:27017/bms?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: 5000
    restart: always

volumes:
  mongo_data:
  redis_data: